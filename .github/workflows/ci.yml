name: CI

# Este paquete lo consumen las dos apps a la vez: un cambio que rompa aquí las
# rompe a las dos. Tipos y compilación en cada push y cada PR.
#
# También en los tags, porque no hay registro que haga de aduana: las apps
# instalan desde `git+https://…#vX.Y.Z`, así que el tag ES el artefacto. Lo que
# se empuje mal ahí lo instalan las dos directamente.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A mano, sin tener que empujar nada.
  #
  # Faltaba, y se notó el 2026-09-16: al volver Actions tras el corte del
  # 2026-08-09 había que saber si `main` estaba verde en los siete repos, y en
  # este no se podía averiguar sin ensuciar el historial con un commit de humo.
  # Cuatro de los siete tenían el mismo hueco.
  #
  # Importa más aquí que en otros: este paquete no pasa por ningún registro que
  # haga de aduana —las apps instalan desde `git+https://…#vX.Y.Z`— así que poder
  # comprobar un tag a mano, sin empujar, es la única aduana que hay.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Dos empujones seguidos dejaban los dos runs corriendo a la vez, compitiendo
  # por los mismos minutos. Este grupo cancela el anterior en las ramas de PR,
  # donde solo importa el último commit.
  #
  # En main y en los tags NO cancela: el sha entra en el nombre del grupo, así
  # que cada uno tiene grupo propio y se valida entero. Aquí eso importa el
  # doble, porque el tag ES el artefacto que instalan las dos apps: un tag sin
  # comprobar es un paquete publicado sin comprobar.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: vitest 5 declara `engines` como
          # `^22.12.0 || ^24.0.0 || >=26.0.0`, y Node 20 queda FUERA de ese rango.
          # Se subió al pasar a vitest 5 para cerrar la cadena esbuild → vite →
          # vitest (2026-09-15).
          #
          # Qué se comprobó y qué no: el rango sale de leer el `engines` del
          # vitest instalado. NO se ejecutó la suite sobre Node 20 —en esta máquina
          # no hay uno— así que no puedo afirmar si npm lo rechaza o solo avisa.
          # Con Actions caído por el impago, esto tampoco se pondría rojo solo:
          # correr el CI en una versión que el paquete declara no soportar es
          # apostar, y no hay nadie que cobre la apuesta hasta que vuelva la cuenta.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: El tag y la versión del package.json tienen que coincidir
        # Las apps anclan a `#vX.Y.Z`. Si el tag dice v0.1.4 y el package.json
        # dice 0.1.3, instalan un paquete que se presenta con otra versión que
        # la que pidieron: el lockfile cuadra, el `npm ls` miente y nadie lo ve
        # hasta que toca depurar por qué un arreglo "ya está" y no está.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag dice v$TAG y package.json dice $PKG. Corrige uno de los dos."
            exit 1
          fi
          echo "Versión $PKG, coincide con el tag."

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Contraste de los tokens
        # El README manda medir el contraste en los dos temas antes de tocar
        # tokens.css. Esto lo hace cumplir: un cambio de color que baje de AA
        # (4.5:1) para en el PR, no en las dos apps a la vez.
        run: npm run contraste

      - name: Tests
        # useDialogA11y es la pieza con lógica que no se ve en un typecheck:
        # contador de diálogos, inert de hermanos, trampa de foco.
        run: npm test

      - name: Compilar
        run: npm run build

      - name: El paquete tiene que llevar lo que dice que lleva
        # `npm pack` respeta la lista `files` del package.json. Si alguien añade
        # un archivo nuevo y olvida incluirlo, aquí se ve antes de publicar y no
        # después, cuando la app que lo instala falla al importar.
        run: |
          npm pack --silent >/dev/null
          TGZ="$(ls -1 *.tgz | head -1)"
          echo "Contenido de $TGZ:"
          tar -tzf "$TGZ" | sed 's|^package/|  |' | sort
          for f in package/tokens.css package/preset.js package/dist/index.js package/dist/index.d.ts; do
            if ! tar -tzf "$TGZ" | grep -qx "$f"; then
              echo "::error::Falta $f en el tarball. Revisa la lista \`files\` del package.json."
              exit 1
            fi
          done
          echo "Los cuatro puntos de entrada están."
