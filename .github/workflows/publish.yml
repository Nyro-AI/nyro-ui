name: Publicar en GitHub Packages

# Se dispara al empujar un tag `v*` (el flujo normal, `npm version` ya lo crea)
# o a mano desde la pestaña Actions, útil para reintentar una publicación que
# falló sin tener que mover el tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# El GITHUB_TOKEN del propio repo basta para publicar en el scope de su org:
# NO hace falta un PAT con write:packages para esto. El PAT solo es necesario
# para publicar a mano desde tu máquina, o para que OTROS repos INSTALEN el
# paquete (ahí hace falta read:packages).
permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Escribe el .npmrc que apunta el scope @nyro-ai a GitHub Packages.
          registry-url: https://npm.pkg.github.com
          scope: '@nyro-ai'

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: El tag y la versión del package.json tienen que coincidir
        # Sin esto se puede publicar 0.1.0 bajo el tag v0.2.0 y quedarse con un
        # tag que apunta a un contenido que no es el suyo. Se salta en las
        # ejecuciones manuales, que no tienen tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag dice v$TAG y package.json dice $PKG. Corrige uno de los dos."
            exit 1
          fi
          echo "Versión $PKG, coincide con el tag."

      - name: Comprobar que la versión no está ya publicada
        # npm publish fallaría igual, pero con un error de registro genérico.
        # Este mensaje dice exactamente qué hacer.
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@nyro-ai/ui@$PKG" version >/dev/null 2>&1; then
            echo "::error::@nyro-ai/ui@$PKG ya existe. Sube la versión con 'npm version patch|minor|major'."
            exit 1
          fi
          echo "La versión $PKG está libre."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen
        run: |
          PKG="$(node -p "require('./package.json').version")"
          {
            echo "## @nyro-ai/ui@$PKG publicado"
            echo
            echo "Para consumirlo, las apps necesitan \`NODE_AUTH_TOKEN\` con **read:packages**"
            echo "y el \`.npmrc\` que ya está commiteado en los dos repos."
            echo
            echo '```bash'
            echo "npm install @nyro-ai/ui@$PKG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
